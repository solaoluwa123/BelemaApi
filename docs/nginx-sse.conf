# Nginx snippet for Belema SSE (/sparkpayapi/transactions/live-stream)
# Merge into the location block that proxies to the Spring Boot API (port 8077).

location /sparkpayapi/transactions/live-stream {
    proxy_pass http://127.0.0.1:8077;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Required for Server-Sent Events — disable buffering so events flush immediately
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;

    # Keep long-lived connections open (adjust for your environment)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
