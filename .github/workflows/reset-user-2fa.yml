name: Reset user 2FA

on:
  workflow_dispatch:
    inputs:
      email:
        description: User email to reset 2FA for
        required: true
        default: sannifaial@gmail.com

permissions:
  contents: read

jobs:
  reset-2fa:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BELEMA_SSH_KEY }}

      - name: Clear 2FA for user
        env:
          BELEMA_HOST: ${{ secrets.BELEMA_SSH_HOST }}
          BELEMA_USER: ${{ secrets.BELEMA_SSH_USER }}
          EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "$BELEMA_USER@$BELEMA_HOST" "mysql -u ajipay -p'Admin12+' -e \"
            UPDATE sparkpayweb_db.tbl_users
            SET two_fa_enabled = 0, two_fa_secret = ''
            WHERE LOWER(username) = LOWER('${EMAIL}');
            SELECT username, two_fa_enabled, CHAR_LENGTH(two_fa_secret) AS secret_len
            FROM sparkpayweb_db.tbl_users
            WHERE LOWER(username) = LOWER('${EMAIL}');
          \""
